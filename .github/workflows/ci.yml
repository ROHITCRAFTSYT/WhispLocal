name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile all modules
        run: python -m py_compile whisp/adaptive.py whisp/app.py whisp/appcontext.py whisp/audio.py whisp/chords.py whisp/cleanup.py whisp/commands.py whisp/configio.py whisp/cues.py whisp/editing.py whisp/history.py whisp/inject.py whisp/locallm.py whisp/obsidian.py whisp/overlay.py whisp/planner.py whisp/recovery.py whisp/settings.py whisp/snippets.py whisp/styles.py whisp/transcriber.py whisp/tray.py warmup.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
